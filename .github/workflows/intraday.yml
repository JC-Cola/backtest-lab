name: intraday
# SPY/QQQ noise-band breakout on the INTRADAY Alpaca paper account. live_noise.py --once ignores runs outside the
# session, acts once per check point, and is safe to run late or twice.
# Checks: runs at :01 and :31 past the hour, 13:01-20:31 UTC on weekdays (covers 10:00-15:00 New York in EST and EDT),
# dispatched by Supabase pg_cron (job bl-intraday); GitHub's own cron dropped runs.
# Market close: NO market-on-close orders (Alpaca paper let them expire). The run at 15:56 New York closes the position
# with a plain market order; its cron is '56 19,20 * * 1-5' UTC (the one that falls at 14:56 NY is a harmless no-op).
on:
  workflow_dispatch:

concurrency:
  group: backtest-lab-trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Intraday check
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_SECRET_KEY: ${{ secrets.ALPACA_INTRADAY_SECRET_KEY }}
        run: cd src && python live_noise.py --once
      - name: Telegram fill alerts (Alpaca paper accounts)
        if: always()
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_SECRET_KEY: ${{ secrets.ALPACA_INTRADAY_SECRET_KEY }}
          ALPACA_DTS_API_KEY: ${{ secrets.ALPACA_DTS_API_KEY }}
          ALPACA_DTS_SECRET_KEY: ${{ secrets.ALPACA_DTS_SECRET_KEY }}
          ALPACA_TA_API_KEY: ${{ secrets.ALPACA_TA_API_KEY }}
          ALPACA_TA_SECRET_KEY: ${{ secrets.ALPACA_TA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sleep 5   # let market orders fill
          cd src && python fill_alerts.py || true
      - name: Commit log and state
        if: always()  # a failed run must still save what it already did
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in agent_memory/noise_live.csv agent_memory/noise_state_*.json agent_memory/alpaca_intraday.json agent_memory/fill_alerts.json; do
            [ -e "$f" ] && git add -- "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -q -m "Intraday run $(TZ=America/New_York date '+%Y-%m-%d %H:%M') New York"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push -q && exit 0
            sleep 5
          done
          exit 1
      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export MSG="⚠️ intraday run failed at $(TZ=America/New_York date '+%H:%M') New York: $RUN_URL"
          cd src && python -c "import os, telegram; telegram.send(os.environ['MSG'])" || true
