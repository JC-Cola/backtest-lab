name: system_qlib
# qlib: Microsoft qlib (Alpha158 + LightGBM + TopkDropoutStrategy topk 50 / n_drop 5) trading the dedicated Alpaca PAPER account
# (ALPACA_DTS_* secrets; the account day-trader-skill used to trade, which is now a shadow ledger). See QLIB_PLAN_15.md.
# Dispatch only (Supabase pg_cron), weekdays, UTC. Both runs are idempotent and a no-op on market holidays.
#   rebalance, after the close:      22:00 UTC  ->  '0 22 * * 1-5'            (17:00 EST / 18:00 EDT; the daily bar is final)
#       inputs: mode=rebalance (default). Updates data, refits monthly, scores, queues DAY market orders for the next open.
#   fill alerts, after the open:     14:45 UTC  ->  '45 14 * * 1-5'  with {"mode":"fills"}   (9:45 EST / 10:45 EDT)
#       inputs: mode=fills. Only runs src/fill_alerts.py (the orders from the night before fill at the open).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rebalance (default) or fills"
        required: false
        default: rebalance
      force:
        description: "re-run a night that is already done (true/false)"
        required: false
        default: "false"

concurrency:
  group: backtest-lab-system-qlib
  cancel-in-progress: false

permissions:
  contents: write

env:
  ALPACA_DTS_API_KEY: ${{ secrets.ALPACA_DTS_API_KEY }}
  ALPACA_DTS_SECRET_KEY: ${{ secrets.ALPACA_DTS_SECRET_KEY }}
  ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
  ALPACA_INTRADAY_SECRET_KEY: ${{ secrets.ALPACA_INTRADAY_SECRET_KEY }}
  ALPACA_TA_API_KEY: ${{ secrets.ALPACA_TA_API_KEY }}
  ALPACA_TA_SECRET_KEY: ${{ secrets.ALPACA_TA_SECRET_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  system-qlib:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qlib.txt
      - run: pip install -r requirements-qlib.txt
      - name: Restore qlib data and model cache
        uses: actions/cache@v4
        with:
          path: |
            data/qlib/csv
            data/qlib/models
          key: qlib-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            qlib-${{ runner.os }}-
      - name: qlib nightly rebalance
        if: ${{ github.event.inputs.mode != 'fills' }}
        run: |
          cd src
          if [ "${{ github.event.inputs.force }}" = "true" ]; then python system_qlib.py run --force; else python system_qlib.py run; fi
      - name: Telegram fill alerts (qlib account)
        if: ${{ always() }}
        run: |
          sleep 3
          cd src && python fill_alerts.py || true
      - name: Commit the ledger
        if: always()  # a failed run must still save what it already did
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in agent_memory/system_qlib.json agent_memory/fill_alerts.json; do
            [ -e "$f" ] && git add -- "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -q -m "qlib run $(TZ=America/New_York date '+%Y-%m-%d %H:%M') New York"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash -q && git push -q && exit 0
            sleep 5
          done
          exit 1
      - name: Telegram alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export MSG="⚠️ qlib run failed at $(TZ=America/New_York date '+%H:%M') New York: $RUN_URL"
          cd src && python -c "import os, telegram; telegram.send(os.environ['MSG'])" || true
