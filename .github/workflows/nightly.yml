name: nightly
# After the US close, weekdays 21:45 UTC (16:45 EST / 17:45 EDT): minute-data refresh, Strategy Lab page, news shadow test,
# fill alerts, flat guard, then the daily report as a commit and an issue. The long-term account was retired 2026-11-09:
# no long-term orders are placed any more. Market DATA uses alpaca_keys.data_keys() (intraday key first). The self-improving agents run in research.yml.
# Timer: Supabase pg_cron (job bl-nightly) dispatches this workflow; GitHub's own cron dropped runs.
on:
  workflow_dispatch:
    inputs:
      no_orders:
        description: "Deprecated and ignored (the long-term account was retired); kept so an old dispatch payload still works"
        type: boolean
        default: false

concurrency:
  group: backtest-lab-trading
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
  ALPACA_INTRADAY_SECRET_KEY: ${{ secrets.ALPACA_INTRADAY_SECRET_KEY }}
  ALPACA_DTS_API_KEY: ${{ secrets.ALPACA_DTS_API_KEY }}
  ALPACA_DTS_SECRET_KEY: ${{ secrets.ALPACA_DTS_SECRET_KEY }}
  ALPACA_TA_API_KEY: ${{ secrets.ALPACA_TA_API_KEY }}
  ALPACA_TA_SECRET_KEY: ${{ secrets.ALPACA_TA_SECRET_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # the very first run downloads ~10 years of minute bars (about 45 minutes)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: today
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ steps.today.outputs.d }}
          restore-keys: |
            data-
      - name: Drop restored Yahoo daily files (stale by a few minutes; they re-download in seconds)
        run: find data -maxdepth 1 -name '*.csv' ! -name fomc_dates.csv -delete
      - name: Refresh minute data (the data/ cache saved by this job is what research.yml restores)
        run: cd src && python intraday_data.py SPY QQQ
      - name: Strategy Lab build (candidates + page; no orders are placed)
        run: cd src && python daily.py
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "20"
      - name: Claude Code CLI (LLM review of news shocks; the scan still runs without it)
        if: always()
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Shadow news-rule test (S&P 500 + Nasdaq-100 scan + LLM review; hypothetical trades only, no orders)
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        timeout-minutes: 25   # scan ~30 s + up to 15 Claude reviews (hard cap 10 min inside the script)
        run: cd src && python news_shadow.py || true
      - name: Telegram fill alerts (Alpaca paper accounts)
        if: always()
        run: |
          sleep 5   # let market orders fill
          cd src && python fill_alerts.py || true
      - name: Intraday account must be flat after the close (alert only)
        if: always()
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_SECRET_KEY: ${{ secrets.ALPACA_INTRADAY_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cd src && python flat_guard.py || true
      - name: Live vs backtest reconciliation (alert only; writes agent_memory/reconcile.json, committed below)
        if: always()
        run: cd src && python reconcile.py || true
      - name: Daily report
        if: always()
        run: cd src && python report.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in agent_memory report/lab.html reports; do
            [ -e "$f" ] && git add -- "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -q -m "Nightly run $(TZ=America/New_York date +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash -q && git push -q && exit 0
            sleep 5
          done
          exit 1
      - name: Open the report issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(TZ=America/New_York date +%F)
          gh label create daily-report --color 0E8A16 --description "Daily trading report" 2>/dev/null || true
          if [ -f "reports/$D.md" ]; then
            gh issue create --title "Trading report $D" --label daily-report --body-file "reports/$D.md"
          else
            gh issue create --title "Trading report $D" --label daily-report \
              --body "The report could not be built. See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export MSG="⚠️ nightly run failed at $(TZ=America/New_York date '+%H:%M') New York: $RUN_URL"
          cd src && python -c "import os, telegram; telegram.send(os.environ['MSG'])" || true
      - name: Evening Telegram briefing
        if: always()
        run: cd src && python briefing.py evening
